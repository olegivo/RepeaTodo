---
format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
trigger_map:
- pull_request_source_branch: "*"
  workflow: primary
- tag: ":^[0-9]+\\.[0-9]+\\.[0-9]+$"
  workflow: deploy-android-play
workflows:
  deploy-ios:
    description: |
      Archives the iOS app and uploads the IPA to Bitrise.io.

      Next steps:
      - Set up [Connecting to an Apple service with API key](https://devcenter.bitrise.io/en/accounts/connecting-to-services/connecting-to-an-apple-service-with-api-key.html##).
      - Or further customise code signing following our [iOS code signing](https://devcenter.bitrise.io/en/code-signing/ios-code-signing.html) guide.
    steps:
    - git-clone@8: {}
    - cocoapods-install@2:
        inputs:
        - is_cache_disabled: 'true'
    - xcode-archive@5:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - distribution_method: "$BITRISE_DISTRIBUTION_METHOD"
        - automatic_code_signing: api-key
        - cache_level: none
    - deploy-to-bitrise-io@2: {}
  deploy-android-play:
    description: |
      Builds a signed Android App Bundle and uploads it to Google Play
      internal testing. Triggered by a 3-part numeric tag (1.2.3) or
      Start/Schedule. Promote to production in Play Console.

      versionName = <tag>.<BITRISE_BUILD_NUMBER>
      versionCode = Major*1000000 + Minor*10000 + Patch*100 + (BITRISE_BUILD_NUMBER % 100)
      Tag from BITRISE_GIT_TAG, else nearest git describe tag, else 0.0.1.

      Requires Bitrise Code signing: Android keystore and generic file
      PLAY_SERVICE_ACCOUNT_JSON ($BITRISEIO_PLAY_SERVICE_ACCOUNT_JSON_URL).
    steps:
    - git-clone@8:
        inputs:
        - fetch_tags: "yes"
    - script@1:
        title: Calculate Android versionCode and versionName
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex

            if [ -n "$BITRISE_GIT_TAG" ]; then
              BASE_VERSION="$BITRISE_GIT_TAG"
              echo "Сборка по тегу: $BASE_VERSION"
            else
              BASE_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
              echo "Сборка без тега. Найден предыдущий тег: $BASE_VERSION"
            fi

            if [[ "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            else
              MAJOR=0
              MINOR=0
              PATCH=1
              BASE_VERSION="0.0.1"
            fi

            BUILD_DIGIT=$(( BITRISE_BUILD_NUMBER % 100 ))
            CALCULATED_VERSION_CODE=$(( (MAJOR * 1000000) + (MINOR * 10000) + (PATCH * 100) + BUILD_DIGIT ))
            FINAL_VERSION_NAME="${BASE_VERSION}.${BITRISE_BUILD_NUMBER}"

            echo "Итоговый versionCode: $CALCULATED_VERSION_CODE"
            echo "Итоговый versionName: $FINAL_VERSION_NAME"

            envman add --key CALCULATED_VERSION_CODE --value "$CALCULATED_VERSION_CODE"
            envman add --key CALCULATED_VERSION_NAME --value "$FINAL_VERSION_NAME"
    - change-android-versioncode-and-versionname@1:
        inputs:
        - build_gradle_path: "./androidApp/build.gradle.kts"
        - new_version_code: "$CALCULATED_VERSION_CODE"
        - new_version_name: "$CALCULATED_VERSION_NAME"
    - restore-cache@2:
        title: Restore Gradle dependency cache
        inputs:
        - key: |
            {{ .OS }}-{{ .Arch }}-gradle-deps-agp813-{{ checksum "gradle/libs.versions.toml" "gradle/wrapper/gradle-wrapper.properties" "gradle.properties" "build.gradle.kts" "settings.gradle.kts" }}
            {{ .OS }}-{{ .Arch }}-gradle-deps-agp813-
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - gradle-runner@4:
        title: 'Gradle: bundleRelease'
        inputs:
        - gradle_task: ":androidApp:bundleRelease"
        - gradlew_path: "$GRADLEW_PATH"
        - app_file_include_filter: "*.aab"
        - mapping_file_include_filter: none
    - sign-apk@2:
        title: Android Sign
        inputs:
        - android_app: "$BITRISE_AAB_PATH"
    - google-play-deploy@3:
        title: Google Play Deploy — internal testing
        inputs:
        - service_account_json_key_path: "$BITRISEIO_PLAY_SERVICE_ACCOUNT_JSON_URL"
        - package_name: ru.olegivo.repeatodo.android
        - app_path: "$BITRISE_SIGNED_AAB_PATH"
        - track: internal
        - status: completed
        - retry_without_sending_to_review: "true"
    - deploy-to-bitrise-io@2: {}
    - save-cache@1:
        title: Save Gradle dependency cache
        inputs:
        - key: '{{ .OS }}-{{ .Arch }}-gradle-deps-agp813-{{ checksum "gradle/libs.versions.toml" "gradle/wrapper/gradle-wrapper.properties" "gradle.properties" "build.gradle.kts" "settings.gradle.kts" }}'
        - paths: |
            ~/.gradle/caches/modules-*/files-*
            ~/.gradle/caches/modules-*/metadata-*
            ~/.gradle/wrapper
        - is_key_unique: "true"
        - compression_level: 1
  primary:
    description: |
      The workflow only builds the project because the project scanner could not find any tests.

      Next steps:
      - Check out [Getting started with iOS apps](https://devcenter.bitrise.io/en/getting-started/getting-started-with-ios-apps.html).
    steps:
    - git-clone@8: {}
    # Split Gradle vs Kotlin/Native caches. The bundled save-gradle-cache step
    # puts ~/.konan (compiler + LLVM, ~1GB) in the same archive as Maven
    # artifacts and keys it on **/*.gradle*, so a targetSdk bump forces a
    # 1.3GB rewrite. Konan only changes with the Kotlin version.
    - restore-cache@2:
        title: Restore Gradle dependency cache
        inputs:
        - key: |
            {{ .OS }}-{{ .Arch }}-gradle-deps-agp813-{{ checksum "gradle/libs.versions.toml" "gradle/wrapper/gradle-wrapper.properties" "gradle.properties" "build.gradle.kts" "settings.gradle.kts" }}
            {{ .OS }}-{{ .Arch }}-gradle-deps-agp813-
    - restore-cache@2:
        title: Restore Kotlin/Native cache
        inputs:
        - key: |
            {{ .OS }}-{{ .Arch }}-konan-k1910-{{ checksum "gradle/libs.versions.toml" }}
            {{ .OS }}-{{ .Arch }}-konan-k1910-
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - restore-cocoapods-cache@2: {}
    - cocoapods-install@2:
        inputs:
        - is_cache_disabled: 'true'
    - gradle-runner@4:
        inputs:
        - app_file_include_filter: none
        - mapping_file_include_filter: none
        - gradle_task: ":androidApp:assembleDebug :shared:assembleSharedDebugXCFramework"
        title: 'Gradle: Build Android'
    - gradle-runner@4:
        inputs:
        - app_file_include_filter: none
        - mapping_file_include_filter: none
        - gradle_task: ":shared:assembleSharedDebugXCFramework"
        title: 'Gradle: Build Shared XCFramework'
    - xcode-build-for-simulator@3:
        inputs:
        - code_signing_allowed: 'yes'
        - configuration: Debug
        is_skippable: true
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            # write your script here
            echo "Hello World!"

            pwd
            ls ./shared/build/
            ls ./shared/build/bin/
            ls ./shared/build/bin/iosSimulatorArm64/
            ls ./shared/build/bin/iosSimulatorArm64/debugFramework/
            ls ./shared/build/bin/iosSimulatorArm64/debugFramework/sharedSwift/

            # or run a script from your repository, like:
            # bash ./path/to/script.sh
            # not just bash, e.g.:
            # ruby ./path/to/script.rb
        is_always_run: true
    - gradle-runner@4:
        inputs:
        - app_file_include_filter: none
        - mapping_file_include_filter: none
        - gradle_task: ":shared:jvmTest"
        title: 'Gradle: shared tests'
    - gradle-runner@4:
        inputs:
        - app_file_include_filter: none
        - mapping_file_include_filter: none
        - gradle_task: ":shared:generateCommonMainRepeaTodoDbSchema
            :shared:verifySqlDelightMigration"
        title: 'Gradle: Check DB Migrations'
    - script@1:
        title: Sanitize branch name for artifact zip
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            # `zip` treats "/" in the archive name as a path separator, so a branch
            # name like "cursor/upgrade-kotlin-1-9-10-eba9" makes deploy-to-bitrise-io
            # try to write the zip into a non-existent subdirectory and fail
            # ("zip I/O error: No such file or directory"). Replace "/" with "-".
            SAFE_BRANCH=$(printf '%s' "$BITRISE_GIT_BRANCH" | tr '/' '-')
            envman add --key SAFE_BRANCH --value "$SAFE_BRANCH"
    - deploy-to-bitrise-io@2:
        title: Deploy to Bitrise.io - Test Reports
        inputs:
        - is_compress: 'true'
        - zip_name: RepeaTodo - $BITRISE_BUILD_NUMBER - $SAFE_BRANCH - Common Tests
        - deploy_path: "./shared/build/reports/tests/jvmTest/"
    - deploy-to-bitrise-io@2: {}
    - save-cache@1:
        title: Save Gradle dependency cache
        inputs:
        - key: '{{ .OS }}-{{ .Arch }}-gradle-deps-agp813-{{ checksum "gradle/libs.versions.toml" "gradle/wrapper/gradle-wrapper.properties" "gradle.properties" "build.gradle.kts" "settings.gradle.kts" }}'
        - paths: |
            ~/.gradle/caches/modules-*/files-*
            ~/.gradle/caches/modules-*/metadata-*
            ~/.gradle/wrapper
        - is_key_unique: "true"
        - compression_level: 1
    - save-cache@1:
        title: Save Kotlin/Native cache
        inputs:
        - key: '{{ .OS }}-{{ .Arch }}-konan-k1910-{{ checksum "gradle/libs.versions.toml" }}'
        - paths: |
            ~/.konan/kotlin-*
            ~/.konan/dependencies
        - is_key_unique: "true"
        - compression_level: 1
    - save-cocoapods-cache@1: {}
meta:
  bitrise.io:
    stack: osx-xcode-latest-stable
    machine_type_id: g2-m1.4core
app:
  envs:
  - opts:
      is_expand: false
    BITRISE_PROJECT_PATH: iosApp/RepeaTodo.xcworkspace
  - opts:
      is_expand: false
    BITRISE_SCHEME: RepeaTodo Debug
  - opts:
      is_expand: false
    BITRISE_DISTRIBUTION_METHOD: development
  - opts:
      is_expand: false
    PROJECT_LOCATION: "."
  - opts:
      is_expand: false
    MODULE: app
  - opts:
      is_expand: false
    VARIANT: debug
  - opts:
      is_expand: false
    GRADLEW_PATH: "./gradlew"
